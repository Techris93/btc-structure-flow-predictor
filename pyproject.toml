[project]
name = "btc-predictor"
version = "0.1.0"
description = "Causal Bitcoin structure, liquidity-zone and order-flow predictor"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "flask>=3.0", "gunicorn>=21.0", "requests>=2.31", "pywebpush>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
