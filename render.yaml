services:
  - type: web
    name: btc-structure-flow-predictor
    repo: https://github.com/Techris93/btc-structure-flow-predictor
    runtime: python
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install .
    startCommand: MALLOC_ARENA_MAX=2 MALLOC_TRIM_THRESHOLD_=131072 gunicorn --workers 1 --threads 4 --timeout 120 --max-requests 200 --max-requests-jitter 40 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    disk:
      name: btc-predictor-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: BTC_DATA_DIR
        value: /var/data
      - key: BTC_RESEARCH_STATUS
        value: /var/data/research/status.json
      - key: PUSH_COOLDOWN_SECONDS
        value: "60"
      # This is intentionally a single-installation service: one active
      # browser/PWA endpoint is retained at a time.
      - key: PUSH_SINGLE_INSTALLATION
        value: "1"
      - key: SIGNAL_CONFIRM_OBSERVATIONS
        value: "2"
      - key: SIGNAL_INVALIDATION_OBSERVATIONS
        value: "3"
      - key: BIAS_CONFIRM_OBSERVATIONS
        value: "2"
      - key: START_LIVE_LOOP_ON_BOOT
        value: "1"
      - key: LIVE_BOOT_RETRY_SECONDS
        value: "5"
      - key: LIVE_POLL_SECONDS
        value: "45"
      - key: LIVE_WATCHDOG_MISSED_POLLS
        value: "3"
      - key: LIVE_WATCHDOG_CHECK_SECONDS
        value: "15"
      - key: TRADE_LOOKBACK_MINUTES
        value: "15"
      - key: TRADE_RETENTION_MINUTES
        value: "120"
      - key: TRADE_QUERY_LIMIT
        value: "20000"
      - key: TRADE_STORE_MAX_ROWS
        value: "40000"
      - key: MAX_PROJECTED_ZONES
        value: "200"
      - key: MARKET_TYPE
        value: "linear"
      - key: BINANCE_REST_ENABLED
        value: "0"
      - key: BINANCE_REST_ON_STALE
        value: "1"
      - key: BINANCE_STALE_REST_MINUTES
        value: "1"
      - key: COLLECTOR_STALE_SECONDS
        value: "150"
      - key: BINANCE_REST_MINUTES
        value: "15"
      - key: BINANCE_TRADE_LIMIT
        value: "100"
      - key: BINANCE_FLOW_LIMIT
        value: "60"
      - key: BINANCE_WS_RECONNECT_SECONDS
        value: "15"
      - key: BINANCE_WS_RECONNECT_MAX_SECONDS
        value: "120"
      - key: BYBIT_WS_RECONNECT_SECONDS
        value: "5"
      - key: MAX_SWING_EQUAL_ZONES
        value: "80"
      - key: PAPER_LEDGER_PATH
        value: "/var/data/paper_ledger.json"
  - type: worker
    name: btc-structure-flow-research
    repo: https://github.com/Techris93/btc-structure-flow-predictor
    runtime: python
    plan: starter
    region: singapore
    branch: main
    autoDeploy: false
    buildCommand: pip install .
    startCommand: python research_worker.py --data-dir /var/data/research
    disk:
      name: btc-research-checkpoints
      mountPath: /var/data
      sizeGB: 25
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: BTC_RESEARCH_DIR
        value: /var/data/research
