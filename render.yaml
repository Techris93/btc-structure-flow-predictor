services:
  - type: web
    name: btc-structure-flow-predictor
    repo: https://github.com/Techris93/btc-structure-flow-predictor
    runtime: python
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install .
    startCommand: MALLOC_ARENA_MAX=2 MALLOC_TRIM_THRESHOLD_=131072 gunicorn --config gunicorn_config.py --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    disk:
      name: btc-predictor-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: BTC_DATA_DIR
        value: /var/data
      - key: BTC_RESEARCH_STATUS
        value: /var/data/research/status.json
      - key: PUSH_COOLDOWN_SECONDS
        value: "60"
      # This is intentionally a single-installation service: one active
      # browser/PWA endpoint is retained at a time.
      - key: PUSH_SINGLE_INSTALLATION
        value: "1"
      - key: SIGNAL_CONFIRM_OBSERVATIONS
        value: "2"
      - key: SIGNAL_INVALIDATION_OBSERVATIONS
        value: "3"
      - key: BIAS_CONFIRM_OBSERVATIONS
        value: "2"
      - key: CONTINUATION_REARM_SECONDS
        value: "1800"
      - key: CONTINUATION_REARM_ATR
        value: "1.0"
      - key: TP_REARM_SECONDS
        value: "7200"
      - key: PAPER_SAME_SIDE_TP_COOLDOWN_HOURS
        value: "2"
      - key: USE_FIXED_PCT_EXITS
        value: "1"
      - key: FIXED_STOP_PCT
        value: "0.01"
      - key: FIXED_TARGET_PCT
        value: "0.02"
      - key: START_LIVE_LOOP_ON_BOOT
        value: "1"
      - key: LIVE_BOOT_RETRY_SECONDS
        value: "5"
      - key: LIVE_POLL_SECONDS
        value: "45"
      - key: LIVE_WATCHDOG_MISSED_POLLS
        value: "3"
      - key: LIVE_WATCHDOG_CHECK_SECONDS
        value: "15"
      - key: TRADE_LOOKBACK_MINUTES
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      - key: LIVE_SUMMARY_LOG_SECONDS
        value: "300"
      - key: TRADE_RETENTION_MINUTES
        value: "120"
      - key: TRADE_QUERY_LIMIT
        value: "20000"
      - key: TRADE_STORE_MAX_ROWS
        value: "40000"
      - key: MAX_PROJECTED_ZONES
        value: "200"
      # Independent market-flow and two-venue raw-footprint thresholds are
      # entry authority. The legacy composite remains diagnostic-only.
      - key: FLOW_GATE_MODE
        value: independent
      - key: MARKET_FLOW_THRESHOLD
        value: "0.40"
      - key: RAW_FOOTPRINT_THRESHOLD
        value: "0.40"
      - key: FOOTPRINT_PRICE_BUCKET
        value: "25"
      - key: FOOTPRINT_FULL_CREDIT_RATIO
        value: "1.5"
      - key: MARKET_TYPE
        value: "linear"
      # Direct Binance futures is primary. A configured proxy remains optional.
      - key: BINANCE_PROXY_REQUIRED
        value: "0"
      - key: BINANCE_WS_HEARTBEAT_TIMEOUT_SECONDS
        value: "35"
      - key: BINANCE_WS_RECONNECT_BASE_SECONDS
        value: "5"
      - key: BINANCE_WS_RECONNECT_MAX_SECONDS
        value: "120"
      - key: BINANCE_WS_RECONNECT_JITTER_MIN
        value: "0.80"
      - key: BINANCE_WS_RECONNECT_JITTER_MAX
        value: "1.20"
      - key: BINANCE_WS_STALE_ALERT_SECONDS
        value: "150"
      - key: PUSH_LAG_ALERT_SECONDS
        value: "300"
      - key: BINANCE_REST_ENABLED
        value: "1"
      - key: BINANCE_REST_STARTUP_BACKFILL
        value: "1"
      - key: BINANCE_REST_GAP_RECOVERY
        value: "1"
      - key: BINANCE_REST_GAP_SECONDS
        value: "45"
      - key: BINANCE_REST_ERROR_RETRY_SECONDS
        value: "60"
      - key: BINANCE_REST_WEIGHT_CAP
        value: "1200"
      - key: COLLECTOR_STALE_SECONDS
        value: "150"
      - key: BINANCE_TRADE_LIMIT
        value: "100"
      - key: BINANCE_FLOW_LIMIT
        value: "60"
      - key: BYBIT_WS_RECONNECT_SECONDS
        value: "5"
      - key: MAX_SWING_EQUAL_ZONES
        value: "80"
      - key: PAPER_LEDGER_PATH
        value: "/var/data/paper_ledger.json"
      # Set a new unique value once to archive the current paper ledger and
      # start a fresh book. The reset is one-shot and does not delete the archive.
      - key: PAPER_LEDGER_RESET_ID
        sync: false
  - type: worker
    name: btc-structure-flow-research
    repo: https://github.com/Techris93/btc-structure-flow-predictor
    runtime: python
    plan: starter
    region: singapore
    branch: main
    autoDeploy: false
    buildCommand: pip install .
    startCommand: python research_worker.py --data-dir /var/data/research
    disk:
      name: btc-research-checkpoints
      mountPath: /var/data
      sizeGB: 25
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: BTC_RESEARCH_DIR
        value: /var/data/research
